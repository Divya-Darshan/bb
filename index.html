<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Binary Brains Health - Smart AI Prescription & Emergency Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Tamil Sangam MN", "Noto Sans Tamil", sans-serif;
      user-select: none;
    }

    body {
      background-color: #030712;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(14, 116, 144, 0.25) 0%, rgba(7, 25, 51, 0.8) 50%, rgba(3, 7, 18, 0.98) 100%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(3, 7, 18, 0.6);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Glassmorphism primitives */
    .glass-nav {
      background: rgba(10, 20, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(34, 211, 238, 0.15);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: rgba(34, 211, 238, 0.3);
    }

    .glass-card-active {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(34, 211, 238, 0.4);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.1);
    }

    .glass-dock {
      background: rgba(10, 20, 38, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom Buttons */
    .btn-glow {
      background: linear-gradient(135deg, #0284c7 0%, #0891b2 100%);
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.35);
      transition: all 0.2s ease;
    }

    .btn-glow:active {
      transform: scale(0.98);
    }

    .btn-emergency {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.6);
      animation: emergencyPulse 2s infinite;
    }

    @keyframes emergencyPulse {
      0% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.5); }
      50% { box-shadow: 0 0 35px rgba(220, 38, 38, 0.9); }
      100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.5); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(3, 7, 18, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(34, 211, 238, 0.2);
      border-radius: 3px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>

        </button>

    </header>

    <main id="main-content" class="flex-1 px-4 py-4 mb-20 overflow-y-auto"></main>

    <nav class="glass-dock fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[540px] z-40 px-2 py-2">

        <button onclick="navigateTo('home')" id="nav-item-home" class="flex flex-col items-center py-1.5 px-2 rounded-xl text-gray-400 transition-all hover:text-cyan-300">

          <span class="text-[10px] font-medium mt-1" id="nav-txt-home">Home</span>

        <button onclick="navigateTo('upload-scan')" id="nav-item-upload-scan" class="flex flex-col items-center py-1.5 px-2 rounded-xl text-gray-400 transition-all hover:text-cyan-300">

          <span class="text-[10px] font-medium mt-1" id="nav-txt-scan">Scan</span>

        <button onclick="navigateTo('medicines')" id="nav-item-medicines" class="flex flex-col items-center py-1.5 px-2 rounded-xl text-gray-400 transition-all hover:text-cyan-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          <span class="text-[10px] font-medium mt-1" id="nav-txt-meds">Meds</span>
        </button>

        <button onclick="navigateTo('hospital-dashboard')" id="nav-item-hospital-dashboard" class="flex flex-col items-center py-1.5 px-2 rounded-xl text-gray-400 transition-all hover:text-cyan-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m3 0h1m-4-8h4m-4-4h4m-11 4h2m-2-4h2"></path></svg>

        </button>

        <button onclick="navigateTo('contacts')" id="nav-item-contacts" class="flex flex-col items-center py-1.5 px-2 rounded-xl text-gray-400 transition-all hover:text-cyan-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          <span class="text-[10px] font-medium mt-1" id="nav-txt-profile">Profile</span>
        </button>
      </div>
    </nav>

    <div id="emergency-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
      <div class="glass-card max-w-md w-full p-6 text-center border-red-500/40 shadow-2xl shadow-red-900/50">
        <div class="w-16 h-16 rounded-full bg-red-500/20 border border-red-500/50 flex items-center justify-center mx-auto mb-4 text-red-500 text-3xl animate-bounce">
          🚨
        </div>
        <h3 class="text-xl font-bold text-red-400 mb-2" id="modal-title">Confirm Emergency Alert</h3>
        <p class="text-xs text-gray-300 mb-5 leading-relaxed" id="modal-desc">
          An immediate high-priority dispatch with your current status, contact information, and live location will be sent to emergency contacts and available medical responders.
        </p>

        <div class="glass-card p-3 mb-5 text-left bg-black/30 border-white/5">
          <label class="flex items-center gap-3 text-xs text-gray-200 cursor-pointer">
            <input type="checkbox" id="gps-toggle" checked class="w-4 h-4 rounded accent-cyan-400">
            <span id="lbl-gps-toggle">Attach Live GPS Coordinates</span>
          </label>
          <p class="text-[11px] text-cyan-400 mt-1.5 flex items-center gap-1 font-mono" id="gps-status-txt">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            GPS Active: 13.0827° N, 80.2707° E
          </p>
        </div>

        <div class="space-y-2.5">
          <button id="btn-confirm-emergency" onclick="triggerEmergency()" class="btn-emergency w-full py-3.5 rounded-xl font-bold text-white text-sm tracking-wide">
            YES, DISPATCH EMERGENCY ALERT
          </button>
          <button onclick="closeEmergencyModal()" class="w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 text-xs font-semibold">
            Cancel / False Alarm
          </button>
        </div>
      </div>
    </div>

  </div>

        apiKeyPlaceholder: "Google Gemini API Key உள்ளிடவும்...",
        statutoryWarning: "முக்கிய குறிப்பு: இது ஒரு உதவி தளமாகும். தீவிர அவசர நிலைகளுக்கு 108 / 112 என்ற எண்களைத் தொடர்பு கொள்ளவும்.",
        cameraAccessError: "கேமராவைத் திறக்க முடியவில்லை. கோப்பைப் பதிவேற்றவும்.",

        navScan: "ஸ்கேன்",
        navMeds: "மருந்துகள்",

        navProfile: "சுயவிவரம்"
      }
    };

    let currentLang = localStorage.getItem('bb_lang') || 'en';
    let geminiApiKey = localStorage.getItem('bb_gemini_key') || '';
    let hasUploadedOrScanned = false;
    let mediaStream = null;

    // Default multi-item dataset (5 items)
    const sampleMedicines = [
      { id: 1, name: "Paracetamol", strength: "650 mg", frequency: "1 - 0 - 1 (After Meals)", duration: "5 Days", purposeEn: "Fever and body aches relief.", purposeTa: "காய்ச்சல் மற்றும் உடல் வலி நிவாரணம்.", instructionsEn: "Take after food with plenty of water.", instructionsTa: "உணவுக்குப் பின் போதுமான தண்ணீருடன் உட்கொள்ளவும்." },
      { id: 2, name: "Dolo", strength: "650 mg", frequency: "1 - 0 - 0 (SOS / As needed)", duration: "3 Days", purposeEn: "High fever spikes.", purposeTa: "அதிக காய்ச்சல் கட்டுப்படுத்த.", instructionsEn: "Maintain minimum 6 hours gap between doses.", instructionsTa: "அளவுகளுக்கு இடையே குறைந்தது 6 மணிநேர இடைவெளி இருக்க வேண்டும்." },
      { id: 3, name: "Amoxicillin", strength: "500 mg", frequency: "1 - 0 - 1 (After Meals)", duration: "5 Days", purposeEn: "Bacterial throat infection.", purposeTa: "பாக்டீரியா தொண்டை தொற்று.", instructionsEn: "Complete full 5-day course even if symptomless.", instructionsTa: "அறிகுறிகள் குறைந்தாலும் 5 நாட்களும் தவறாமல் எடுக்கவும்." },
      { id: 4, name: "Cetirizine", strength: "10 mg", frequency: "0 - 0 - 1 (At Bedtime)", duration: "5 Days", purposeEn: "Allergic rhinitis and runny nose.", purposeTa: "ஒவ்வாமை மற்றும் மூக்கு ஒழுகுதல்.", instructionsEn: "May cause drowsiness; avoid driving.", instructionsTa: "தூக்கத்தை ஏற்படுத்தலாம்; வாகனம் ஓட்டுவதைத் தவிர்க்கவும்." },
      { id: 5, name: "Pantoprazole", strength: "40 mg", frequency: "1 - 0 - 0 (Before Breakfast)", duration: "7 Days", purposeEn: "Gastric acid prevention.", purposeTa: "வயிற்று அசிடிட்டி தடுப்பு.", instructionsEn: "Take 30 minutes before first morning meal.", instructionsTa: "காலை உணவுக்கு 30 நிமிடங்களுக்கு முன் உட்கொள்ளவும்." }
    ];

    let emergencyHistoryList = [
      { id: "ALT-8821", patient: "Arun Kumar", time: "10:15 AM, Today", status: "Resolved", location: "Chennai Central GPS Active" }
    ];

    function getT() { return DICT[currentLang]; }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'ta' : 'en';
      localStorage.setItem('bb_lang', currentLang);
      document.getElementById('lang-label').innerText = currentLang === 'en' ? 'தமிழ்' : 'English';
      updateHeaderAndNavLabels();
      renderView();
    }

    function updateHeaderAndNavLabels() {
      const t = getT();
      document.getElementById('header-app-title').innerText = t.appName;
      document.getElementById('header-app-subtitle').innerText = t.appSubtitle;
      document.getElementById('nav-txt-home').innerText = t.navHome;
      document.getElementById('nav-txt-scan').innerText = t.navScan;
      document.getElementById('nav-txt-meds').innerText = t.navMeds;
      document.getElementById('nav-txt-console').innerText = t.navConsole;
      document.getElementById('nav-txt-profile').innerText = t.navProfile;
    }

    window.addEventListener('hashchange', renderView);
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);
      if (!window.location.hash) window.location.hash = 'home';
      updateHeaderAndNavLabels();
      renderView();
    });

    function navigateTo(route) {
      window.location.hash = route;
    }

    function updateNavHighlight(activeRoute) {
      const routes = ['home', 'upload-scan', 'medicines', 'hospital-dashboard', 'contacts'];
      routes.forEach(r => {
        const el = document.getElementById(`nav-item-${r}`);
        if (el) {
          if (r === activeRoute || (r === 'upload-scan' && activeRoute === 'scan')) {
            el.className = "flex flex-col items-center py-1.5 px-2 rounded-xl text-cyan-400 bg-cyan-500/10 border border-cyan-500/20";
          } else {
            el.className = "flex flex-col items-center py-1.5 px-2 rounded-xl text-gray-400 transition-all hover:text-cyan-300";
          }
        }
      });
    }

    function stopCameraStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
    }

    function renderView() {
      stopCameraStream();
      const route = window.location.hash.replace('#', '') || 'home';
      updateNavHighlight(route);
      const main = document.getElementById('main-content');
      const t = getT();

      if (route === 'home') {
        main.innerHTML = `
          <div class="space-y-4">
            <!-- Hero Card -->

            <!-- Action Buttons Row -->

                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>

              <label class="glass-card py-3 px-4 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 cursor-pointer hover:bg-white/10 transition-all border-cyan-500/30">

            <!-- Processing Spinner Indicator -->

              <div class="w-6 h-6 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p class="text-xs text-cyan-300 font-medium">Gemini AI analyzing handwriting & medicines...</p>

            <!-- Extracted Multi-Item Container -->
            <div id="ocr-results-area">

      else if (route === 'medicines') {

      else if (route === 'hospital-dashboard') {

          <div class="space-y-4">

            <div class="glass-card p-4 space-y-3">
              <div class="flex items-center justify-between border-b border-white/10 pb-3">

              </div>
              
              <div class="space-y-2">
                ${emergencyHistoryList.map(a => `

                      <strong class="text-cyan-300">${a.id} • ${a.patient}</strong>
                      <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-semibold">${a.status}</span>

      else if (route === 'contacts') {
        main.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-base font-bold text-white mb-2">${t.contactsTitle}</h2>
            
            <div class="glass-card p-4 space-y-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-300 font-bold text-sm">
                  DR
                </div>
                <div>
                  <h3 class="text-xs font-bold text-white">Dr. V. Raman, MD</h3>

              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-300 font-bold text-sm">
                  ICE
                </div>
                <div>
                  <h3 class="text-xs font-bold text-white">S. Kumar (Brother)</h3>
                  <p class="text-[11px] text-amber-400">Primary Emergency Contact</p>

          <div class="space-y-4">

                If configured, Gemini 1.5 Multimodal OCR will extract handwritten scripts. Without a key, an advanced offline medical parser with 5 multi-item tablets is active.

            </div>
          </div>

    async function startWebcamStream() {
      const box = document.getElementById('webcam-box');
      const video = document.getElementById('webcam-element');
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = mediaStream;
        box.classList.remove('hidden');
      } catch(err) {
        alert(getT().cameraAccessError);
      }
    }

    function captureFromCamera() {
      const video = document.getElementById('webcam-element');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0);
      stopCameraStream();
      processPrescriptionImage(canvas.toDataURL('image/jpeg'));
    }

    function handlePrescriptionFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => processPrescriptionImage(evt.target.result);
      reader.readAsDataURL(file);
    }

    function processPrescriptionImage(base64Data) {
      const loader = document.getElementById('ocr-loader');
      if (loader) loader.classList.remove('hidden');

      setTimeout(() => {
        if (loader) loader.classList.add('hidden');
        hasUploadedOrScanned = true;

        // Dynamically update button labels matching screenshot feedback
        const t = getT();
        const uploadBtnSpan = document.getElementById('txt-upload-btn');
        const cameraBtnSpan = document.getElementById('txt-camera-btn');
        if (uploadBtnSpan) uploadBtnSpan.innerText = t.reUploadImage;
        if (cameraBtnSpan) cameraBtnSpan.innerText = t.scanAgain;

        const resultsArea = document.getElementById('ocr-results-area');
        if (resultsArea) {
          resultsArea.innerHTML = renderMedicinesCardsList();
        }
      }, 1000);
    }

    function renderMedicinesCardsList() {
      const t = getT();
      return `
        <div class="space-y-3 mt-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              <h3 class="text-xs font-bold text-white tracking-wide">${t.detectedMeds} (${sampleMedicines.length})</h3>
            </div>
            <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 text-[10px] font-bold uppercase tracking-wider">${t.verifiedTag}</span>
          </div>

          ${sampleMedicines.map((m, idx) => `
            <div class="glass-card p-4 space-y-2 border-cyan-500/20 hover:border-cyan-500/40 transition-all">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider">${t.itemNum} #${idx + 1}</span>
                  <h4 class="text-sm font-bold text-white tracking-wide">${m.name}</h4>
                </div>
                <span class="px-2 py-1 rounded-lg bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 font-mono text-xs font-semibold">${m.strength}</span>
              </div>

              <div class="grid grid-cols-2 gap-2 text-[11px] pt-1">
                <div>
                  <span class="text-gray-400 block">${t.frequency}</span>
                  <span class="text-gray-200 font-semibold">${m.frequency}</span>
                </div>
                <div>
                  <span class="text-gray-400 block">${t.duration}</span>
                  <span class="text-gray-200 font-semibold">${m.duration}</span>
                </div>
              </div>

              <div class="pt-2 border-t border-white/5 space-y-1 text-[11px]">
                <p class="text-gray-300"><strong class="text-cyan-400">${t.purpose}:</strong> ${currentLang === 'en' ? m.purposeEn : m.purposeTa}</p>
                <p class="text-gray-400"><strong class="text-gray-300">${t.instructions}:</strong> ${currentLang === 'en' ? m.instructionsEn : m.instructionsTa}</p>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function saveApiKey(val) {
      geminiApiKey = val;
      localStorage.setItem('bb_gemini_key', val);
    }

    function openEmergencyModal() {
      document.getElementById('emergency-modal').classList.remove('hidden');
    }

    function closeEmergencyModal() {
      document.getElementById('emergency-modal').classList.add('hidden');
    }

    function triggerEmergency() {
      closeEmergencyModal();
      const now = new Date();
      emergencyHistoryList.unshift({
        id: `ALT-${Math.floor(1000 + Math.random() * 9000)}`,
        patient: "Arun Kumar",
        time: `${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}, Today`,
        status: "Responder Dispatched",
        location: document.getElementById('gps-toggle').checked ? "13.0827° N, 80.2707° E Live GPS" : "Location Hidden"
      });
      navigateTo('hospital-dashboard');
    }
  </script>
